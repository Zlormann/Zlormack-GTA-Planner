name: Rockstar Live

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: write

jobs:
  update-rockstar:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mettre a jour Rockstar Live
        run: node scripts/update-rockstar.js

      - name: Sauvegarder les nouvelles donnees
        run: |
          git config user.name "Zlormack GTA Planner Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rockstar-cache.json

          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnee Rockstar."
            exit 0
          fi

          git commit -m "Mise a jour automatique Rockstar Live"
          git push
